server {
    listen 80;
    listen [::]:80;
    server_name hostedtimesheets.com www.hostedtimesheets.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /elapsed-time-calculator {
        return 301 https://hostedtimesheets.com/time-duration-calculator/;
    }

    location = /elapsed-time-calculator/ {
        return 301 https://hostedtimesheets.com/time-duration-calculator/;
    }

    location / {
        return 301 https://hostedtimesheets.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hostedtimesheets.com www.hostedtimesheets.com;

    if ($host = www.hostedtimesheets.com) {
        return 301 https://hostedtimesheets.com$request_uri;
    }

    ssl_certificate /etc/letsencrypt/live/hostedtimesheets.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hostedtimesheets.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:HOSTEDTIMESHEETS_SSL:10m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ~* (?:backup|\.bak|\.old|\.orig|\.tmp|\.save)(?:[-.]|$) {
        return 404;
    }

    location = /elapsed-time-calculator {
        return 301 https://hostedtimesheets.com/time-duration-calculator/;
    }

    location = /elapsed-time-calculator/ {
        return 301 https://hostedtimesheets.com/time-duration-calculator/;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_pass http://hostedtimesheets-preview:80;
    }
}
